services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: quant-modeling-api
    ports:
      - "${QM_API_PORT:-8010}:8000"
    networks:
      - default
      - dataplatform
    environment:
      # Local storage by default — no GCP credentials required (blueprint WP 04).
      - QM_STORAGE=${QM_STORAGE:-local}
      - QM_DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:?set a strong random JWT_SECRET in .env}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-72}
      # Sign in with Google (optional — the button only appears when both are set).
      # QM_PUBLIC_URL must be the origin users type, and match the redirect URI
      # registered in the Google console (deploy/RUNBOOK.md, "Connexion Google").
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - QM_PUBLIC_URL=${QM_PUBLIC_URL:-http://localhost:5180}
      # Market data (prices, macro) comes from the data-ingest Postgres, reached
      # over the shared `dataplatform` network by container name.
      - PGHOST=${PGHOST:-data-ingest-postgres}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-dataingest}
      - PGUSER=${PGUSER:-dataingest}
      - PGPASSWORD=${PGPASSWORD:?set PGPASSWORD in .env (same as data-ingest/.env)}
      - LOG_DIR=/app/logs
      - COMMIT_SHA=${COMMIT_SHA:-dev}
      # Audit trail (blueprint WP 18). "spool" by default in development: the
      # `dataplatform` network leads to the PRODUCTION quant-platform, whose
      # audit database is append-only — a dev event sent there stays forever.
      # "kafka" + QM_KAFKA_BOOTSTRAP only against a disposable broker.
      # IP_HMAC_SECRET is optional: unset, it reuses JWT_SECRET to hash IPs.
      - QM_AUDIT_SINK=${QM_AUDIT_SINK:-spool}
      - QM_KAFKA_BOOTSTRAP=${QM_KAFKA_BOOTSTRAP:-kafka:9092}
      - QM_AUDIT_IP_HMAC_SECRET=${QM_AUDIT_IP_HMAC_SECRET:-}
      - QM_AUDIT_DB_PASSWORD=${QM_AUDIT_DB_PASSWORD:-}
      - QM_ADMIN_USERS=${QM_ADMIN_USERS:-}
      # Telemetry export (WP 18d): off unless set, for the same reason.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=quant-modeling-api-dev
      # Scripting assistant: the llama-server of ~/AgenticEnv. It listens on the
      # host's 127.0.0.1, unreachable from a container; the llama-bridge socket
      # (AgenticEnv `just render-llama-bridge`) exposes it on the Docker gateway.
      - QM_LLM_BASE_URL=${QM_LLM_BASE_URL:-http://172.17.0.1:8001/v1}
    volumes:
      - ./api:/app/api
      - ./logs/quantmodeling:/app/logs
      - qm_data:/app/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: quant-modeling-web
    depends_on:
      - api
    environment:
      # No VITE_API_KEY — the key never reaches the browser (ADR-008).
      # API base is resolved at runtime; this is only the dev proxy target.
      - VITE_API_PROXY_TARGET=http://api:8000
      - VITE_COMMIT_SHA=${COMMIT_SHA:-dev}
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "${QM_WEB_PORT:-5180}:5173"
    command:
      - sh
      - -c
      - >
        echo "Syncing node_modules...";
        npm install --no-audit --no-fund;
        until wget -qO- http://api:8000/health >/dev/null; do
          echo "Waiting for API...";
          sleep 1;
        done;
        npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
  qm_data:

networks:
  # shared with the data-ingest stack (its Postgres). Create it once:
  #   docker network create dataplatform
  dataplatform:
    external: true
