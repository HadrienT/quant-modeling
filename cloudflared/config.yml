# Cloudflare Tunnel — locally managed (blueprint WP 14 §4).
#
# The tunnel and its credentials file are created once with `cloudflared tunnel
# create` (see deploy/RUNBOOK.md §2). This file is the versioned part: it says
# which public hostname maps to which local service. Change a route here, commit,
# `docker compose up -d cloudflared`.
#
# `quant-modeling.json` sits next to this file, is NOT in git, and carries the
# tunnel's secret.

tunnel: quant-modeling
credentials-file: /etc/cloudflared/quant-modeling.json

# Be resilient to brief origin restarts (deploys).
originRequest:
  connectTimeout: 30s
  noTLSVerify: false

ingress:
  # The app's own nginx handles TLS-terminated concerns (headers, gzip, SPA,
  # /api proxy). cloudflared just forwards plain HTTP to it on the compose network.
  - hostname: quant.tramonihadrien.com
    service: http://app:8080
  # Everything else the tunnel might receive: refuse.
  - service: http_status:404
