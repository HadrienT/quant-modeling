# Security headers (blueprint WP 14 §3). Kept in a snippet because nginx's
# `add_header` does NOT merge across block levels: any `location` that sets one
# header of its own drops every inherited one, so this must be `include`d again
# in each such location (index.html, config.json, assets).
#
# CSP: no third-party origin. WebGL needs blob: workers + data: images; fonts are
# self-hosted; the API is same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
