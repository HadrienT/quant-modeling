[build-system]
requires = ["scikit-build-core>=0.10.2"]
build-backend = "scikit_build_core.build"

[project]
name = "quantmodeling"
version = "0.1.0"
description = "Pybind11 bindings for quantModeling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/pypkg"
build.targets = ["quantmodeling"]

# Editable installs (scripts/dev_install.sh) recompile only the C++ files that
# changed, on `import quantmodeling`, reusing the persistent build-dir above.
# Release wheels (scripts/build_wheel.sh, python -m build) are unaffected.
editable.rebuild = true
editable.verbose = false

[tool.scikit-build.cmake]
version = ">=3.20"
build-type = "Release"

[tool.scikit-build.cmake.define]
QM_BUILD_PYTHON = "ON"
QM_BUILD_TESTS = "OFF"
QM_BUILD_CLI = "OFF"
