# Production stack — blueprint WP 14. Self-hosted, no Google Cloud.
# Built image (no code volume, no HMR), reached from the internet only through a
# Cloudflare Tunnel (no inbound port), named volumes for the data that replaced GCS.
#
#   cp .env.placeholder .env   # fill JWT_SECRET, PGPASSWORD
#   ./scripts/deploy.sh        # build + up -d + health gate
#
# See deploy/RUNBOOK.md for the one-time Cloudflare + systemd setup.

name: quant-modeling-prod

services:
  app:
    build:
      context: .
      dockerfile: web/Dockerfile.prod
      args:
        VITE_COMMIT_SHA: ${COMMIT_SHA:-dev}
    image: ghcr.io/hadrient/quant-modeling:${COMMIT_SHA:-latest}
    container_name: quant-modeling
    restart: unless-stopped
    labels:
      # Same name as OTEL_SERVICE_NAME below: the compose service is `app`.
      service.name: quant-modeling-api
    networks:
      - default
      - dataplatform
    environment:
      - PORT=8080
      - API_URL=http://127.0.0.1:8000
      - COMMIT_SHA=${COMMIT_SHA:-dev}
      # Runtime app config — same origin, so apiBase stays empty.
      - APP_API_BASE=
      # Same-origin in practice; set explicitly so a stray cross-origin call is refused.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-https://tramonihadrien.com,https://www.tramonihadrien.com}
      - QM_STORAGE=local
      - QM_DATA_DIR=/app/data
      # Scripting assistant: the llama-server of ~/AgenticEnv, reached through
      # the llama-bridge socket on the Docker gateway (127.0.0.1 is the
      # container itself). Login is required to use it.
      - QM_LLM_BASE_URL=${QM_LLM_BASE_URL:-http://172.17.0.1:8001/v1}
      - JWT_SECRET=${JWT_SECRET:?set a strong random JWT_SECRET in .env}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-72}
      # Sign in with Google (optional — the button only appears when both are set).
      # QM_PUBLIC_URL must be the origin users type, and match the redirect URI
      # registered in the Google console (deploy/RUNBOOK.md, "Connexion Google").
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - QM_PUBLIC_URL=${QM_PUBLIC_URL:-https://tramonihadrien.com}
      # data-ingest Postgres (market data), over the shared network
      - PGHOST=${PGHOST:-data-ingest-postgres}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-dataingest}
      - PGUSER=${PGUSER:-dataingest}
      - PGPASSWORD=${PGPASSWORD:?set PGPASSWORD in .env (same as data-ingest/.env)}
      - LOG_DIR=/app/logs
      # Audit trail → quant-platform's Kafka (blueprint WP 18b), over the shared
      # `dataplatform` network. If the broker is down the events wait in the
      # spool (LOG_DIR/spool) and are republished when it answers: the site
      # never depends on the platform. IP_HMAC_SECRET is optional: unset, it
      # reuses JWT_SECRET to hash IPs (contract §1, ADR-009).
      - QM_AUDIT_SINK=${QM_AUDIT_SINK:-kafka}
      - QM_KAFKA_BOOTSTRAP=${QM_KAFKA_BOOTSTRAP:-kafka:9092}
      - QM_AUDIT_IP_HMAC_SECRET=${QM_AUDIT_IP_HMAC_SECRET:-}
      # Replay of a recorded valuation (WP 18e, POST /api/admin/replay/{id}):
      # read-only access to quant-platform's audit database (the
      # AUDIT_DB_READER_PASSWORD of its .env), and the accounts allowed to use
      # it. Either unset: the endpoint answers 503 / 403.
      - QM_AUDIT_DB_PASSWORD=${QM_AUDIT_DB_PASSWORD:-}
      - QM_ADMIN_USERS=${QM_ADMIN_USERS:-}
      # Metrics and traces → quant-platform's OTel Collector (WP 18d). Empty
      # disables the export; the API runs the same.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=quant-modeling-api
    # Local debug only — the tunnel reaches the container over the compose
    # network, not through a host port. 8091 avoids the dev stack on 5180.
    ports:
      - "127.0.0.1:${QM_WEB_PORT:-8091}:8080"
    volumes:
      - qm_data:/app/data
      - qm_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        # The V100s, for the GPU Monte-Carlo backend (blueprint/wp/19-gpu.md
        # §8). Needs the NVIDIA container runtime on the host (installed: it
        # serves AgenticEnv's llama-server too). Shared, not exclusive: the
        # engines size their batches from the memory free at the time.
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        # quant-platform's Collector names each container's log stream after
        # these labels (its ADR-016 §2): `service.name` first, so the logs are
        # filed under the traces' name and Grafana's trace → logs link works.
        labels: "service.name,com.docker.compose.service"

  # Outbound-only connection to Cloudflare's edge. No inbound port is opened on
  # the host or the router. The tunnel is dashboard-managed: create it in
  # Cloudflare Zero Trust, add the public hostnames there, paste the token into
  # .env as CLOUDFLARE_TUNNEL_TOKEN (see deploy/RUNBOOK.md §3).
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: quant-modeling-tunnel
    restart: unless-stopped
    # In the `tunnel` profile: a bare `docker compose up -d` starts only `app`;
    # deploy.sh adds `--profile tunnel` once CLOUDFLARE_TUNNEL_TOKEN is set.
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qm_data:
  qm_logs:

networks:
  dataplatform:
    external: true
