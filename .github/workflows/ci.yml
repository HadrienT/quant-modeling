name: ci

on:
  push:
  pull_request:

jobs:

  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: clang-format check
        run: |
          FILES=$(git ls-files '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp' '*.hh')
          if [ -n "$FILES" ]; then
            clang-format --dry-run --Werror $FILES
          fi
          
  build-test:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-format curl zip unzip tar pkg-config \
            autoconf autoconf-archive automake libtool

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Ensure vcpkg is present
        run: |
          if [ ! -d "vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg
          fi

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure (preset)
        run: cmake --preset default

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Palette validation
        run: npm run palette

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run size

      - name: Storybook build
        run: npm run build-storybook

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: e2e (compose stack)
        working-directory: .
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf "http://localhost:${QM_WEB_PORT:-5180}" >/dev/null && break
            sleep 3
          done
          cd web && QM_E2E_BASE_URL="http://localhost:${QM_WEB_PORT:-5180}" npx playwright test
          cd .. && docker compose down
        continue-on-error: true

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API deps
        run: pip install -r api/requirements.txt

      - name: Regenerate OpenAPI types and check drift
        run: |
          # A stub stands in for the native pybind11 module — the OpenAPI shape
          # does not depend on it. See scripts/gen_openapi.py.
          python scripts/gen_openapi.py web/openapi.json
          cd web
          npm ci
          npx openapi-typescript openapi.json -o src/shared/api/schema.gen.ts
          if ! git diff --exit-code -- openapi.json src/shared/api/schema.gen.ts; then
            echo "::error::OpenAPI drift. Run: python scripts/gen_openapi.py web/openapi.json && cd web && npm run api:types:local"
            exit 1
          fi

  # Blueprint WP 14 §6 — build & publish the self-hosted image on main.
  publish-image:
    if: github.ref == 'refs/heads/main'
    needs: [build-test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile.prod
          push: true
          build-args: VITE_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
